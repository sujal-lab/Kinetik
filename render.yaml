services:
  # ==========================================
  # 1. Kinetik Backend (Node.js Web Service)
  # ==========================================
  - type: web
    name: kinetik-backend
    runtime: node
    plan: free
    rootDir: kinetik-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        value: caboose.proxy.rlwy.net
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: dSgblCyJflolPhijcCsZlOdTcFLrvRdf
      - key: DB_NAME
        value: railway
      - key: DB_PORT
        value: 33444

  # ==========================================
  # 2. Kinetik Frontend (React Static Site)
  # ==========================================
  - type: web
    name: kinetik-frontend
    runtime: static
    plan: free
    rootDir: kinetik-react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
